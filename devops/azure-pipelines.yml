trigger:
  batch: true
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # ⚠️ APNI ACR KA NAAM YAHAN UPDATE KAREIN (Bina .azurecr.io ke)
  acrName: 'crhrmsenterprise'
  backendImageName: 'hrms-backend-service'
  frontendImageName: 'hrms-frontend-service'
  buildTag: '$(Build.BuildId)'
  # ⚠️ APNE AZURE SERVICE CONNECTION KA NAAM YAHAN UPDATE KAREIN
  azureServiceConnection: 'Your-Azure-Subscription-Name'

stages:
- stage: BuildAndValidate
  displayName: 'Stage 1: Code Compilation & Test Suites'
  jobs:
  - job: Backend_Validation
    displayName: 'Validate FastAPI Architecture'
    steps:
    - script: |
        cd backend
        docker build --no-cache -t $(backendImageName):test .
      displayName: 'Execute Async PyTest Suite Inside Isolation Container'

  - job: Frontend_Validation
    displayName: 'Validate React TS Architecture'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Provision Node.js Environment Engine'
    - script: |
        cd frontend
        npm ci
        npm run build
      displayName: 'Execute Production Transpilation via Vite Builder'

- stage: PackageAndPushContainers
  displayName: 'Stage 2: Package & Push Container Assets'
  dependsOn: BuildAndValidate
  condition: succeeded()
  jobs:
  - job: Build_And_Publish
    displayName: 'Container Layer Compilation'
    steps:
    # 🔥 Using pre-installed Docker@2 connection task instead of AzureContainerRegistry@1
    - task: Docker@2
      displayName: 'Login to Azure Container Registry'
      inputs:
        command: 'login'
        containerRegistry: '$(azureServiceConnection)'

    - script: |
        # Build images with registry tags
        docker build -f ./backend/Dockerfile -t $(acrName).azurecr.io/$(backendImageName):$(buildTag) -t $(acrName).azurecr.io/$(backendImageName):latest ./backend
        docker build -f ./frontend/Dockerfile -t $(acrName).azurecr.io/$(frontendImageName):$(buildTag) -t $(acrName).azurecr.io/$(frontendImageName):latest ./frontend
        
        # Push images to your Azure Container Registry
        docker push $(acrName).azurecr.io/$(backendImageName):latest
        docker push $(acrName).azurecr.io/$(backendImageName):$(buildTag)
      displayName: 'Bake & Push Immutable Application Containers'

- stage: DeployToAzureCloud
  displayName: 'Stage 3: Continuous Deployment to App Service'
  dependsOn: PackageAndPushContainers
  condition: succeeded()
  jobs:
  - job: Deploy_Backend
    displayName: 'Deploy FastAPI Engine to App Service'
    steps:
    - task: AzureWebAppContainer@1
      displayName: 'Force Deploy Container & Set Custom Ports'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        appName: 'app-hrms-backend-api'
        containers: '$(acrName).azurecr.io/$(backendImageName):latest'
        # Force restart the stuck web app container over port 8000
        appSettings: '-WEBSITES_PORT 8000 -WEBSITES_CONTAINER_START_TIME_LIMIT 600'
