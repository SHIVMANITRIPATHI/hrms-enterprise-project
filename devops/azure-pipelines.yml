trigger:
  batch: true
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # ⚠️ Pakka karein ki ye naam aapki registry ka hi hai
  acrName: 'crhrmsenterprise'
  backendImageName: 'hrms-backend-service'
  frontendImageName: 'hrms-frontend-service'
  buildTag: '$(Build.BuildId)'
  # ⚠️ Pakka karein ki ye naam aapke service connection ka hi hai
  azureServiceConnection: 'sc-hrms-enterprise'
  # ⚠️ FrontEnd Resource configuration controls
  frontendAppName: 'app-hrms-frontend-ui'
  resourceGroupName: 'rg-hrms-enterprise'

stages:
- stage: BuildAndValidate
  displayName: 'Stage 1: Code Compilation & Test Suites'
  jobs:
  - job: Backend_Validation
    displayName: 'Validate FastAPI Architecture'
    steps:
    - script: |
        cd backend
        docker build --no-cache -t $(backendImageName):test .
      displayName: 'Execute Async PyTest Suite Inside Isolation Container'

  - job: Frontend_Validation
    displayName: 'Validate React TS Architecture'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Provision Node.js Environment Engine'
    - script: |
        cd frontend
        npm ci
        npm run build
      displayName: 'Execute Production Transpilation via Vite Builder'

- stage: PackageAndPushContainers
  displayName: 'Stage 2: Package & Push Container Assets'
  dependsOn: BuildAndValidate
  condition: succeeded()
  jobs:
  - job: Build_And_Publish
    displayName: 'Container Layer Compilation'
    steps:
    # 🔥 Using native AzureCLI@2 task to securely log in and push to your ACR
    - task: AzureCLI@2
      displayName: 'Login, Bake & Push Immutable Containers via Azure CLI'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # 1. Native Azure login handshake to your specific Container Registry
          az acr login --name $(acrName)
          
          # 2. Build production images with absolute internal workspace targets
          docker build -f ./backend/Dockerfile -t $(acrName).azurecr.io/$(backendImageName):$(buildTag) -t $(acrName).azurecr.io/$(backendImageName):latest ./backend
          docker build -f ./frontend/Dockerfile -t $(acrName).azurecr.io/$(frontendImageName):$(buildTag) -t $(acrName).azurecr.io/$(frontendImageName):latest ./frontend
          
          # 3. Stream and push image layers to your cloud repository logs
          docker push $(acrName).azurecr.io/$(backendImageName):latest
          docker push $(acrName).azurecr.io/$(backendImageName):$(buildTag)
          docker push $(acrName).azurecr.io/$(frontendImageName):latest
          docker push $(acrName).azurecr.io/$(frontendImageName):$(buildTag)

- stage: DeployToAzureCloud
  displayName: 'Stage 3: Continuous Deployment to App Service'
  dependsOn: PackageAndPushContainers
  condition: succeeded()
  jobs:
  - job: Deploy_Backend
    displayName: 'Deploy FastAPI Engine to App Service'
    steps:
    - task: AzureWebAppContainer@1
      displayName: 'Force Deploy Backend Container'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        appName: 'app-hrms-backend-api'
        containers: '$(acrName).azurecr.io/$(backendImageName):latest'
        appSettings: '-WEBSITES_PORT 8000 -WEBSITES_CONTAINER_START_TIME_LIMIT 1800 -SCM_DO_BUILD_DURING_DEPLOYMENT false'
        configurationStrings: '-StartupCommand "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"'

    - task: AzureCLI@2
      displayName: 'Unlock & Force Restart Backend App Service'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Stopping Backend Web App to release stuck threads..."
          az webapp stop --name app-hrms-backend-api --resource-group $(resourceGroupName)
          az webapp config appsettings set --name app-hrms-backend-api --resource-group $(resourceGroupName) --settings WEBSITES_PORT=8000
          az webapp start --name app-hrms-backend-api --resource-group $(resourceGroupName)
          echo "Backend App Service successfully awakened!"

  - job: Deploy_Frontend
    displayName: 'Deploy React UI Engine to App Service'
    dependsOn: Deploy_Backend
    steps:
    - task: AzureStaticWebApp@0
      displayName: 'Force Deploy Frontend to Static Web App'
      inputs:
        app_location: '/frontend'        # आपके फ्रंटएंड कोड का फोल्डर पाथ
        output_location: '/frontend/dist' # Vite का बिल्ड आउटपुट फोल्डर
        azure_static_web_apps_api_token: '$(76c9bd2528b9dc0b805204fe803271a9e6efecdc338063da4560739d7f9a9d6902-7d204b8b-fe3b-491d-b662-a7812712b3740002717073dca200)'

    # 🚀 Step 1: Deploy Frontend Container to Azure Web App (Docker Container mode)
    - task: AzureWebAppContainer@1
      displayName: 'Force Deploy Frontend Container'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        appName: '$(frontendAppName)'
        containers: '$(acrName).azurecr.io/$(frontendImageName):latest'
        appSettings: '-WEBSITES_PORT 80 -WEBSITES_CONTAINER_START_TIME_LIMIT 1800 -SCM_DO_BUILD_DURING_DEPLOYMENT false'

    # 🔥 Step 2: Force Reset to break portal loops and start UI container fresh
    - task: AzureCLI@2
      displayName: 'Unlock & Force Restart Frontend App Service'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Stopping Frontend Web App to release stuck threads..."
          az webapp stop --name $(frontendAppName) --resource-group $(resourceGroupName)
          az webapp config appsettings set --name $(frontendAppName) --resource-group $(resourceGroupName) --settings WEBSITES_PORT=80
          az webapp start --name $(frontendAppName) --resource-group $(resourceGroupName)
          echo "Frontend UI App Service successfully awakened!"
