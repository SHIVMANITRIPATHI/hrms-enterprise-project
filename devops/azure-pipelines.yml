trigger:
  batch: true
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrName: 'crhrmsenterprise'
  backendImageName: 'hrms-backend-service'
  buildTag: '$(Build.BuildId)'
  azureServiceConnection: 'sc-hrms-enterprise'
  resourceGroupName: 'rg-hrms-enterprise'

stages:
- stage: BuildAndValidate
  displayName: 'Stage 1: Code Compilation & Test Suites'
  jobs:
  - job: Backend_Validation
    displayName: 'Validate FastAPI Architecture'
    steps:
    - script: |
        cd backend
        docker build --no-cache -t $(backendImageName):test .
      displayName: 'Execute Async PyTest Suite Inside Isolation Container'

  - job: Frontend_Validation
    displayName: 'Validate React TS Architecture'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Provision Node.js Environment Engine'
    - script: |
        cd frontend
        npm ci
        npm run build
      displayName: 'Execute Production Transpilation via Vite Builder'
    
    # 📦 बने हुए कंपाइल्ड 'dist' फोल्डर को पाइपलाइन की आर्टिफैक्ट स्टोरेज में सुरक्षित करें
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'frontend/dist'
        artifact: 'frontend-static-build'
      displayName: 'Publish Compiled Frontend UI Artifact'

- stage: PackageAndPushContainers
  displayName: 'Stage 2: Package & Push Backend Assets'
  dependsOn: BuildAndValidate
  condition: succeeded()
  jobs:
  - job: Build_And_Publish
    displayName: 'Backend Container Layer Compilation'
    steps:
    - task: AzureCLI@2
      displayName: 'Login, Bake & Push Immutable Backend Container via Azure CLI'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az acr login --name $(acrName)
          docker build -f ./backend/Dockerfile -t $(acrName).azurecr.io/$(backendImageName):$(buildTag) -t $(acrName).azurecr.io/$(backendImageName):latest ./backend
          docker push $(acrName).azurecr.io/$(backendImageName):latest
          docker push $(acrName).azurecr.io/$(backendImageName):$(buildTag)

- stage: DeployToAzureCloud
  displayName: 'Stage 3: Continuous Deployment to Azure Cloud'
  dependsOn: PackageAndPushContainers
  condition: succeeded()
  jobs:
  - job: Deploy_Backend
    displayName: 'Deploy FastAPI Engine to App Service'
    steps:
    - task: AzureWebAppContainer@1
      displayName: 'Force Deploy Backend Container'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        appName: 'app-hrms-backend-api'
        containers: '$(acrName).azurecr.io/$(backendImageName):latest'
        appSettings: '-WEBSITES_PORT 8000 -WEBSITES_CONTAINER_START_TIME_LIMIT 1800 -SCM_DO_BUILD_DURING_DEPLOYMENT false'
        configurationStrings: '-StartupCommand "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"'

    - task: AzureCLI@2
      displayName: 'Unlock & Force Restart Backend App Service'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Stopping Backend Web App to release stuck threads..."
          az webapp stop --name app-hrms-backend-api --resource-group $(resourceGroupName)
          az webapp config appsettings set --name app-hrms-backend-api --resource-group $(resourceGroupName) --settings WEBSITES_PORT=8000
          az webapp start --name app-hrms-backend-api --resource-group $(resourceGroupName)
          echo "Backend App Service successfully awakened!"

  - job: Deploy_Frontend
    displayName: 'Deploy React UI Engine to Static Web App'
    dependsOn: Deploy_Backend
    steps:
    # 📥 Stage 1 में कंपाइल किए गए फ्रंटएंड 'dist' फोल्डर को इस एजेंट पर डाउनलोड करें
    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: 'frontend-static-build'
        path: '$(Pipeline.Workspace)/frontend-static-build'
      displayName: 'Download Compiled Frontend UI Artifact'

    # 🚀 सीधे आर्टिफैक्ट फ़ोल्डर को रूट मानकर फ़ोर्स अपलोड करें
    - task: AzureStaticWebApp@0
      displayName: 'Force Deploy Pre-Built Artifact to Static Web App'
      inputs:
        app_location: '/' 
        output_location: '$(Pipeline.Workspace)/frontend-static-build' 
        skip_app_build: true # 👈 Azure के डिफ़ॉल्ट बिल्ड मैनेजर को बायपास करें
        azure_static_web_apps_api_token: '76c9bd2528b9dc0b805204fe803271a9e6efecdc338063da4560739d7f9a9d6902-7d204b8b-fe3b-491d-b662-a7812712b3740002717073dca200'
